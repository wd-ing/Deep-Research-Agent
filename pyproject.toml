[project]
name = "research-agent"
version = "0.1.0"
description = "本地深度研究 Agent：多轮跟随式检索、证据图谱、跨会话知识管理"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "trafilatura>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
# 向量化。默认走 sentence-transformers，若磁盘吃紧可改用 onnx 变体
embed = ["sentence-transformers>=3.0"]
embed-onnx = ["onnxruntime>=1.19", "tokenizers>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
