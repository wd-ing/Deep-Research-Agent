use_default_settings: true

general:
  instance_name: "WD Search"
  debug: false
  contact_url: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "CHANGE_ME_openssl_rand_hex_32"
  limiter: false
  image_proxy: false
  default_http_headers:
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "no-referrer"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

ui:
  static_use_hash: true
  infinite_scroll: false

outgoing:
  request_timeout: 8.0
  max_request_timeout: 20.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true

