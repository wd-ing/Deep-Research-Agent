# 各环节的模型配置
# 换模型只改这里，不动代码。
#
# ── 模型策略（2026-10-04 定）────────────────────────────────────────
# 全部走 MiniMax，分三档对应三种任务难度：
#
#   T0  MiniMax-M3               不发 thinking、不发 effort → 官方文档：省略即关闭思考
#   T1  M3.1-Flash-Preview        output_config.effort: low
#   T2  M3.1-Flash-Preview        output_config.effort: high
#
# 现状订正（2026-10-19）：实际运行是 T0=M3 关思考；write_audit 已迁到
# M3.1-Flash low（M3 开思考审一次 1.6~2.5 万 token，预算接不住）。
# write_section / write_revise **必须留 M3**：它们靠
# `forced_thinking: disabled` + `round_max_tokens` 吃饭，
# 而 M3.1 关不掉思考（disabled → 400）。
#
# 现状再订正（2026-10-20）：`assess` / `write_plan_spec` /
# `write_plan_tasks` 也迁到 M3.1-Flash low——v14 检查点 A/B 回放
# （/tmp/exp_model_ab/summary.txt）显示分派输出降 ~4 倍、耗时降
# ~6 倍且小节覆盖不变。write_section / write_revise / write_patch
# **仍必须留 M3**（forced_thinking 依赖同上）。
#
# ⚠️ 不要再用 thinking.budget_tokens
# 那是 Anthropic 扩展思考的字段，MiniMax 不认。它的 thinking.type 合法值只有
# adaptive 与 disabled，没有 enabled。那个字段不报 400、只是被静默忽略，于是
# 「0 / 1024 / 4096 / 不传」四组设置实际是同一组（都等于省略 → adaptive +
# 默认 effort=max），思考长度清一色 ~35,000 字符。曾据此得出「思考无法控制、
# 只能换模型」——那是测错了参数名。真正的旋钮是 output_config.effort。
#
# T2 档之所以给足预算：effort 会连带把思考拉长（实测 high 档思考 6,743 字符、
# low 档 575 字符），思考与正文共用 max_tokens，预算不够正文就是 0 字符。
#
# ── 环节切分（2026-10-04）──────────────────────────────────────────
# 原来四个阶段各自承担了性质不同的任务，其中三处耦合不合理，已拆开：
#   · 框架生成曾挂在 write 上（温度 0.3 的散文配置去做结构规划）
#   · 相关性闸门与缺口评估共用 assess，前者是二元判断却挂着思考档位
#   · 证据分派与缺口评估共用 assess
#   · 探针的「快速定性」与「读两万字做综合」共用一档
#
# ── 三道防线（沿用，含义已变）──────────────────────────────────────
# 空返回是真实存在的失败模式，所以每个环节都要配 guard：
#   1. 给足输出预算
#   2. 监控思考占比，超阈值告警
#   3. 空输出自动重试并翻倍预算

# ── 可用的 provider 档案（2026-10-09）──────────────────────────────
#
# **模型策略（2026-11-03）**：MiniMax 订阅到期，默认档换成火山方舟两档组合——
#   ark_mini（doubao-seed-2.0-mini，真关思考 none）管 11 个高频/执行环节；
#   ark_glm（glm-5.3-flash，强制 low——关不掉思考）管 6 个规划/审核环节。
#   minimax/minimax31/internai/xj189 档案保留可切回。
# **模型不写死在代码里。** 每个阶段在 `stages:` 下声明自己用哪个 `provider:`，
# 下面这些档案给出对应的模型名 / 地址 / 密钥变量 / 思考档位。
# 换平台只改这一行，代码一行都不动。
#
#   minimax  —— Anthropic Messages 协议，走 `output_config.effort` 控制思考
#   opencode —— OpenAI 兼容，走 `reasoning_effort`
#   xj189    —— OpenAI 兼容，DeepSeek 系（deepseek-v4-flash-0731，100 万上下文）
#
# xj189 接入预检已实测（2026-10-09，`tests/preflight_xj189.py`）：
#   · 严格 JSON      ✓ 带不带 response_format 都能解析
#   · 工具调用        ✓ OpenAI 标准格式，**支持一个回合多个 tool_calls**，
#                       arguments 是 JSON 字符串 —— write 子 agent 的工具循环能直接用
#   · reasoning_effort 七个档位全部 200，但**思考长度不随档位变**，旋钮疑似无效
#   · 缓存            ✓ 支持，字段是**顶层 `cached_tokens`**
#                       （740 token 前缀不命中、3,489 命中 3,328，门槛在两者之间）
#
# xj189 的平台限流有三种，处置完全不同（`classify_limit`）：
#   · 「服务组/模型调用频率已达上限」 → 按 Retry-After 退避，可重试
#   · 「当前账户并发已达上限」         → 等在途调用腾位，退避要更长
#   · MODEL_SEAT_QUOTA_EXHAUSTED      → **重试无效**，得管理员调额度
# 所以限流额度与传输断连额度**分开计**，否则一次限流就把重试机会耗光。

# ── 2026-11-03 定稿（v28/v29 六个变体真跑后）：最终环节分配 ───────────────
#   mini(none)  : probe_light/probe_degraded/extract/relevance/dedupe/summarize/session_summary
#   glm high    : probe_outline/outline/assess/write_plan_spec/write_plan_tasks/write_audit（规划链路）
#   glm low     : write_section/write_revise/write_patch/fast_answer（写手）
# 依据（同题 Rust 对 Go，n=1，方向性证据，原始数据 data/refs/ra_v27~v29_*.db、CONTEXT 坑 93）：
#   · 写手用 mini none 每节只写 ~500–1000 token（~1k 字），glm low / ds none 约 1.5–3k token（~2.7k 字）；
#   · 规划链路 glm low 太薄（5–6 节、mandate ~100 字），ds low 虽充实（7 节、mandate ~376 字）但烧思考
#     （write_plan_tasks 输出 16–22k token/120–250s，整场 12–14 分钟），ds none 仍只有 5 节，
#     glm high 达到 8 节、mandate ~305 字（v26 MiniMax：10 节/327 字），整场 ~650s；
#   · 仍与 v26 有差距：报告 ~23k 字 vs 72k 字（单节 ~2.5k vs ~6.5k 字）——写手深度未追平，待继续调。

providers:
  minimax:
    provider: minimax
    # ⚠️ **必须是 `MiniMax-M3`，不是 `MiniMax-M3.1-Flash-Preview`。**
    # （2026-10-17 逐项实测，理由在 `_minimax` 的注释里）
    #   · M3 的思考开关是 `thinking.type`：`disabled` 关、`adaptive` 开，**两个方向都行**
    #   · M3 对 `output_config.effort` 完全不响应（传 low/high/max 全是 0 思考）
    #   · M3.1-Flash `thinking.type=disabled` 直接 **400** ⇒ **关不掉思考**，
    #     而本项目 7 个环节靠关思考省掉 68% 的 token
    # 可用清单：M3 / M3.1-Flash-Preview / M2.7 / M2.7-highspeed / M2.5 /
    #          M2.5-highspeed / M2.1 / M2.1-highspeed / M2
    model: MiniMax-M3
    base_url: https://api.minimaxi.com/anthropic
    api_key_env: MINIMAX_API_KEY
    # ⚠️ **故意不写 `effort_off`**：这条路径不用 `reasoning_effort` 控制思考，
    # `_minimax` 把它翻译成 `thinking.type`（见那儿的实测对照表）。
    # 写成 `none` 反而会让「关思考」这个语义走错字段。
    #
    # 限流（2026-10-18 实测定数，不再是「没测过」）：
    #   6 并发、极小载荷、打满 60 秒 → 3,248 次尝试只成功 **50** 次，
    #   其余全是 429 `(2062) Token Plan 速率限制`
    #   ⇒ 续速率就在 **50 次/分钟** 附近（被拒的请求是立刻返回的，
    #     所以能试出三千多次）
    #   按 **40/min 配速**发 60 次（用时 89 秒）→ **60/60 全过，零 429**
    #
    # ⚠️ **token 维度没验到**：报错写的是「Token Plan **速率**限制」，
    # 上面两次测的都是极小载荷（输入 ~37 / 输出 ~8 token）。
    # 真实调用（`write_plan_tasks` 65,536 预算）token 量差几个量级，
    # 所以 40/min 只保证**请求速率**不撞，token 速率会不会撞**要下一轮实测**。
    # 这个限制主要保护 relevance 那种高频小调用 —— 上次丢 20/131 的正是它。
    rate_limit_per_min: 40
  minimax31:
    provider: minimax
    # MiniMax-M3.1-Flash（2026-10-19 实测，样本固化在
    # tests/data/audit_tool_inputs.json）：
    #   · effort 是**真**旋钮：low 单次输出约 7~12k token / 60~215s；
    #     medium 8~17k；high 会烧到 24.6k 仍被截断——**只能 low**。
    #   · **关不掉思考**：`thinking.type=disabled` 直接 400。
    #     `StageConfig.validate()` 会拦死 reasoning_effort 缺省
    #     与 forced_thinking 这两种「关思考」写法。
    # ⚠️ **必须写 `-Flash`**：`MiniMax-M3.1` / `MiniMax-M3.1-Preview`
    #    会被平台**静默别名回 M3**——名字写错不报错，只是能力没了。
    model: MiniMax-M3.1-Flash
    base_url: https://api.minimaxi.com/anthropic
    api_key_env: MINIMAX_API_KEY
    # 与 minimax 档案同端点：限流器按 base_url 登记，两个档案共用同一个。
    rate_limit_per_min: 40
  ark_mini:
    provider: ark
    # 火山引擎方舟（Ark）OpenAI 兼容端点（2026-11-03 实测，替代到期的 MiniMax）。
    # 带日期的模型 ID 钉死，避免别名静默换版本（别名：doubao-seed-2.0-mini）。
    #
    #   · reasoning_effort=none = 真关思考（rc_len=0、0.6~2s）
    #   · low/high 在 mini 上**不是轻思考**（实测 low 难题思考 3178 token/41s、
    #     high 5201 token/75s）——所以这条路径只许 disabled→none，
    #     不许给它写 low/high
    #   · tool_choice auto/required/指定函数 都被遵守；max_tokens 到 131072
    #   · 限额 RPM 30000 / TPM 5M——三档里最快最便宜的执行层
    #
    # 与 ark_glm 同 base_url：限流器按端点登记取档案最大值，
    # 所以这里的 rate_limit 不必单独写（同端点已按 400 慢档放行），
    # 写明是接受「mini 也会被按 glm 的 400/min 限」的取舍——
    # 分开限速需要两个 base_url，不值得为这条分清两个端点。
    model: doubao-seed-2-0-mini-260428
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    api_key_env: ARK_API_KEY
    # 关思考翻译表：环节写 `reasoning_effort: disabled` → 发 `none`
    effort_off: none
  ark_glm:
    provider: ark
    # 火山 glm-5-3-flash（别名 glm-5.3-flash，带日期 ID 钉死）。
    #   · **关不掉思考**：`thinking.type=disabled` 直接 400；
    #     不发 reasoning_effort = 默认 max 思考（实测 120s+ 超时）；
    #     none/minimal/low→low，medium/high→high，xhigh/max→max。
    #     ⇒ 环节必须显式写 reasoning_effort（现在全部 low），
    #     `StageConfig.validate()` 拦死缺省与 max/xhigh。
    #   · 吞吐 ~50 token/s、首字延迟 ~8s——比 mini 慢一个量级，预期。
    #   · 限额 RPM 500 / TPM 1M；慢档，写 400 留一点余量。
    model: glm-5-3-flash-260828
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    api_key_env: ARK_API_KEY
    # ⚠️ 故意不写 effort_off：disabled 在这个模型上=发 none（翻译后仍是
    # 开思考 low），但语义会骗人——“关思考”在 glm 上不存在。
    # 需要它的环节一律写显式档位，不写 disabled。
    rate_limit_per_min: 400
  ark_ds:
    provider: ark
    # 备选档案（2026-11-04 实测，尚未切任何环节）。
    # deepseek-v4-flash（别名；响应里 model 是带日期的 -ga-260731，钉死 ID）。
    #   · reasoning_effort=none/minimal = 真关思考（rc=0）；不传 = 开思考
    #     （默认 high）；low 真思考（小题 44~204 tok，难题 1471 tok）；
    #     medium→low、xhigh→high；thinking:{type:disabled} 也能关
    #   · 工具 forced/required 都被遵守；缓存生效（第二次 cached=2048）
    #   · 首字延迟 ~1.5~2s（glm 约 8s）；但长输出吞吐 ~48 tok/s 与 glm
    #     同量级（mini ~86 tok/s）；难题 high 120s+ 超时
    #   · 备选：若 glm 的首字延迟/吞吐成瓶颈，规划类环节可改用它
    #     （none 关思考 或 low）
    model: deepseek-v4-flash-ga-260731
    base_url: https://ark.cn-beijing.volces.com/api/plan/v3
    api_key_env: ARK_API_KEY
    effort_off: none
  opencode:
    provider: opencode
    base_url: https://api.opencode.ai/v1
    api_key_env: OPENCODE_API_KEY
  internai:
    provider: internai
    # 0731 而非 -vision：**所有预算/effort/思考字数数据都是在这个模型上测的**
    # （write_plan 最大输出 7,654、思考 8,593~41,771 字等）。同一模型换平台，
    # 才是「同实验换地点」，能直接对比；换变体等于拿旧配置开盲盒。
    # 纯文本流水线用不到视觉能力。清单里三个 DeepSeek：0731 / -vision / pro-0813。
    model: deepseek-v4-flash-0731
    base_url: https://discovery-api.intern-ai.org.cn/v1
    api_key_env: INTERN_AI_API_KEY
    # 主动限流（2026-10-17 加）。平台限 **50 次/分钟**，上一轮实测峰值 49/min
    # 贴着天花板，reliability 阶段挨了 20+ 次 429。
    #
    # 退避逻辑（`classify_limit`）是**被动**的：撞了才退，退避期间还在烧时间。
    # 这一项是**主动**的：发之前就把速率压下去。
    #
    # 45 而不是 50：窗口是滑动的（`SendRateLimiter`），留 10% 余量，
    # 不去赌「服务端到底按自然分钟还是滚动窗口算」。
    rate_limit_per_min: 45
    # ---- Atria-Dawn（限时免费）：实测结论是**不能顶替本模型**，留档 ----
    #
    # 2026-10-17 逐项实测（真实载荷 + 生产代码路径）：
    #   ① `reasoning_effort: none` **约 90% 直接 422**
    #      （连发 10 次：422×9 / 200×1）—— 所以 `effort_off: none` 对它不成立，
    #      靠它关思考的 7 个环节会大面积失败，而省略 effort 又是**开着**思考，
    #      **没有第三条路**。
    #   ② `write_plan_tasks` 真实载荷 **1/3**，两次在 ~665 秒流被掐断；
    #      唯一那次成功只给 1 个任务、covers 只覆盖 sec1。
    #   ③ 它慢约 10 倍，reasoning 占比 81~92%（本模型 56%）。
    # ⇒ 不切。要用它只能等 DeepSeek 额度真的见底，且**只切 relevance 一个环节**
    #   （它占 148/189 = 78% 的调用量），配 `low`（实测 8/8 可用，中位 11.4 秒）。
    #   闸门本身是「宁可漏杀不可错杀」，慢 10 倍可接受；别的环节不能这么换。
    # `reasoning_effort: disabled` 在**这个**平台上翻译成什么（2026-10-17 加）。
    # 环节只写平台中性的 `off`，具体怎么关由档案决定 ——
    # 两个平台的语义是反的，写死字面量的话切平台会静默改变含义。
    effort_off: none
    # ⚠️ **这个平台的 reasoning_effort 语义与 xj189 完全相反（2026-10-16 实测 n=3）**
    #
    #              xj189            internai
    #   省略        关思考            **开思考**
    #   none        开思考            **关思考**
    #
    #   省略  思考 70 字 [59~71]  tokens 44
    #   none  思考  0 字 [0~0]    tokens 0   ← 组内方差为零，rc 字段都不返回
    #
    # 所以**要关思考必须显式写 `reasoning_effort: none`，省略反而会打开**。
    # 7 个靠「省略 = 关思考」的环节已全部显式补上 none（见 stages）。
    #
    # ⚠️ **low/medium/high 之间在这道题上分不出差别**（中位 58~70 字，
    # 组内范围完全交叠）。**但这不能推出「effort 无效」** —— 这题是
    # 「找 7 的倍数」，思考只用 60 字，天花板效应。xj189 当初也是在这类
    # 简单题上得出「旋钮疑似无效」的，那个结论同样不成立。
    # 档位到底有没有用，**要在 write_plan 那种真需要规划的活上实测**。
    # 现阶段保持原来的档位分配不动（那份分配本身就是按调用量推的、
    # config 里已注明「质量全部未验证」）。
    #
    # usage 形状与 xj189 不同（2026-10-16 实测）：
    #   · 缓存在 `prompt_tokens_details.cached_tokens`（xj189 是**顶层** cached_tokens）
    #   · `completion_tokens_details.reasoning_tokens` **有真数字**（xj189 是 `{}`）
    #   · **返回 `reasoning_content`**（xj189 不返回）→ 防线二在这里第一次能真正工作，
    #     上一轮为它写的「按思考正文估算」兜底路径在这边不会被触发
    timeout_s: 300
    max_output_tokens: 8192

  xj189:
    provider: xj189
    model: deepseek-v4-flash-0731
    base_url: https://ai.xj.189.cn/api/v1
    api_key_env: XJ189_API_KEY
    # ⚠️ **这里故意不写 `effort_off`。**（2026-10-17）
    #
    # 环节写 `reasoning_effort: disabled` 时，档案没声明 `effort_off` 就翻译成
    # 「**不发这个字段**」—— 因为 xj189 上省略 = 关思考。
    #
    # ⚠️ 这和 internai **正好相反**（那边省略 = 开思考，得显式发 none）。
    # 写死 `none` 字面量的话，切回这个平台会让 7 个本该关思考的环节
    # （relevance / summarize / extract …，占全部调用的 68%）**反向打开思考**，
    # 而且不报错 —— 正是「换个平台静默多烧 token」这类坑。
    #
    # 原实测（2026-10-09，3/3 复验）：
    #   不传        reasoning_content = [0, 0, 0]     1.5~3.0s
    #   none        [140, 121, 399]                   2.3~3.6s
    #   low         [432, 213, 374]                   2.6~7.1s
    #   high        [485, 456, 382]                   3.8~10.5s
    # ⚠️ **这里不要写 reasoning_effort。**（2026-10-09 实测，3/3 复验）
    #
    # 该平台**省略该字段 = 关思考**，传**任何**值（含 none）= 开思考——
    # 和平台文档写的「默认 max、none 是一个档位」正好相反。
    #   不传        reasoning_content = [0, 0, 0]     1.5~3.0s
    #   none        [140, 121, 399]                   2.3~3.6s
    #   low         [432, 213, 374]                   2.6~7.1s
    #   high        [485, 456, 382]                   3.8~10.5s
    #
    # 所以**档案层留空 = 默认关思考**，需要推理的阶段自己在 stages 下写
    # `reasoning_effort: high/low`。这样「高并发内容轻关思考、其余开思考」
    # 就落在配置里，代码一行都不用动。
    #
    # ⚠️ **thinking 吃光输出预算**（与 MiniMax 同一失效模式）：
    #   max_tokens=2048 → 正文 0 字符，reasoning 5,574
    #   max_tokens=8192 → 正常（实测生成 10 节规约只花 1,852 token）
    #   max_tokens=16384 → **504 网关超时**
    # 所以 max_output_tokens 是个窄窗口：给小了没正文、给大了网关挂。
    max_output_tokens: 8192
    # 网关对长生成会 504，超时必须给足
    timeout_s: 300

defaults:
  # ⚠️ **换平台只改这一行。**（2026-10-17）
  #
  # 以前 14 个环节各自硬写 `provider: internai`，切换要改 14 行；
  # 而 `ModelRegistry.stage()` 本来就是 `s.get("provider") or d.get("provider")`
  # —— **单点机制一直都在，只是被硬写绕过了**。现在环节一律不写 provider，
  # 由这里统一决定，档案（模型名 / 地址 / 密钥 / 关思考怎么表达）随之继承。
  #
  # ⚠️ 2026-10-18 **切回 `minimax`**：额度当天一度用尽（见下），
  #   当晚恢复并实测通过（最小请求 200；生产路径预检 4/4；限流已定数 40/min）。
  #   ⚠️ **切回来时 `summarize` 的 `reasoning_effort` 必须留在 `low`** ——
  #   那个 `low` 就是为这条路的「关思考 + 发工具会编造」加的，
  #   改回 `disabled` 会被 `_check_minimax_thinking_tools` **直接拒绝**，
  #   `summarize` 一步都跑不了。只有换到 xj189 / internai 时才能改回 `disabled`。
  #
  # ⚠️ 当天切回 `internai` 的原因（额度用完的那几个小时）：
  #   1 token 的请求都被拒：
  #     {"type":"error","error":{"type":"rate_limit_error",
  #      "message":"已达到 Token Plan 用量上限：… (2056)"}}
  #   而 `GET /v1/models` 仍 200 ⇒ 账号是通的，只是额度没了。
  #   1 token 的请求都被拒：
  #     {"type":"error","error":{"type":"rate_limit_error",
  #      "message":"已达到 Token Plan 用量上限：… (2056)"}}
  #   而 `GET /v1/models` 仍 200 ⇒ 账号是通的，只是额度没了。
  #   （在这之前还见过 `(2062) 速率限制`：relevance 20/131 失败，
  #     说明**该平台的限流必须设 `rate_limit_per_min`**，现在还没设。）
  #   切回来时实测过 internai 7/7 全过（2026-10-18）。
  #
  # ⚠️ 2026-10-17 曾切到 `minimax`，理由与实测留在 DECISIONS 同日两节：
  #   Atria-Dawn 限时免费但**不能用**：`none` 90% 失败、`write_plan_tasks` 1/3。
  #   MiniMax-M3 本身可用（思考两个方向都能控、流式支持、强制工具调用认），
  #   **额度恢复后可以直接切回去**，`providers.minimax` 档案是现成的。
  #
  # 切回去只需改这一行：`provider: internai` / `xj189` / `minimax`。
  # 2026-11-03 起默认 ark_mini：MiniMax 订阅到期，换火山方舟
  # （环节映射见下面注释；glm 档只给 6 个难环节）。
  provider: ark_mini
  temperature: 0.0
  # 180 秒不够。实测（2026-10-05，R6 三轮真实数据）：
  #   write_audit 平均 132 秒、最长 170 秒 —— 已经贴着天花板
  #   write_plan  平均 100 秒
  # 贴天花板意味着：需要 185 秒的调用被砍在 180 秒，然后**整次重发**。
  # 表面上「重试吸收抖动」，实际是把超时变成重发，白花一遍钱和时间。
  # 断连全部集中在这两个 effort:high 的阶段，write_section/write_revise
  # （effort:low，均 17–26 秒）几乎不超时——这正说明它是超时不是抖动。
  timeout_s: 300
  # MiniMax 平台过载（HTTP 5xx / 流式 api_error）的统一重试参数
  # （2026-10-20，拥堵期加；实现见 provider.py::_minimax_send）。
  # 独立额度，不占 guard.retry_on_transport：5 次重试、
  # 退避 10/20/40/60/60s ×(1±jitter)，单次调用总等待上限约 190s。
  # stage 级写同名字典可覆盖单项；环境变量
  # RA_OVERLOAD_RETRIES / RA_OVERLOAD_BASE_S 再覆盖（测试压 0 用）。
  overload_retry: { max_retries: 5, base_s: 10, cap_s: 60, jitter: 0.25 }

# ── 思考分档（2026-10-09，全切 xj189 之后）─────────────────────────
#
# xj189 的旋钮是 `reasoning_effort`，而实测**省略该字段 = 关思考**、
# 传任何值（含 none）= 开。所以「哪个阶段开思考」完全由 stages 下的
# 有无这一行决定，**档案层留空即可**。
#
# 分档依据是 C1d2 那轮的真实数据（调用次数 / 均输出 / 总耗时）：
#
#   档 0  关思考   relevance(92次,均36token) summarize(18次,均263)
#                  extract(6) probe_light(1) probe_degraded(1)
#                  理由：这四档占全部调用的 68%、耗时的 24%，
#                  而输出只有 36~535 token——给它们开思考是纯浪费。
#
#   档 1  low      outline(1) assess(2) write_section(30) write_revise(5)
#                  write_section 用 low 而不是 high：它调用最多（30 次），
#                  边际成本最高，而正文质量未必更好。**这是待验证的保守取值。**
#
#   档 2  high     probe_outline(1) write_plan(2) write_audit(2)
#                  理由：规划与审查是核心推理，量大但调用少。
#
# ⚠️ **质量全部未验证**。这批档位是按「调用次数 × 输出长度」推的，
#    不是按质量实测。切过去的第一件事是跑一轮对比，看每档该给的
#    思考强度给对了没有。

stages:
  # ---- 探针 ----
  probe_light:
    # `disabled` 是**平台中性的语义值**，不是字面量：这个环节要「关思考」，
    # 至于怎么关由平台档案声明（internai 发 none、xj189 干脆不发该字段）。
    # 写死 none 的话，切到 xj189 会**反向打开思考** —— 那是个静默多烧 token 的陷阱。
    #
    # ⚠️ **刻意不用 `off` 当这个值**：YAML 1.1 把裸 `off` 解析成布尔 false，
    # 于是 `== "off"` 判不成立、翻译不发生、字段不发 ⇒ 思考反而默认打开。
    # 那个坑真踩过一次（tests/test_platform_switch.py 抓出来的）。
    # 这个环节是纯机械任务，开思考只会白吃预算。
    reasoning_effort: disabled
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.6, retry_on_empty: 2, max_output_tokens: 8192 }

  # 读 2-3 篇正文归纳领域轮廓。整场研究的地基——大纲的 grounded_in
  # 全部指回这里，所以给最高档。
  probe_outline:
    # 2026-10-25 迁到 M3.1-Flash low（v18 基线真实载荷 A/B，n=3）：
    #   M3 high 中位 55.5s（另有一次工具入参归一化后字段全空），
    #   M3.1 low 中位 23.4s（42%），3/3 无重试、subtopics 9~11、
    #   entities/jargon/controversies 三组全非空。
    #   **退路：删 provider/reasoning/thinking 三行即回 M3。**
    provider: ark_glm
    reasoning_effort: high
    # 流式：绕开 xj189 前面 nginx 的 60 秒读超时（2026-10-10 实测）
    stream: true
    temperature: 0.0
    # ⚠️ 4096 → 8192 → **16384（2026-10-17）**。两次都是被实测逼的：
    #   · 2026-10-15：v5 实测 3,966 = 旧上限 4,096 的 97%，贴墙
    #   · 2026-10-17：换到信通院后输出 **8,192 = 上限 8,192（100%）**，
    #     而提示词要的四组信号只交了三组 —— `subtopics` 5 条正常，
    #     `entities` / `jargon` / `controversies` **全是 0**，
    #     `degraded: false`、`quality: substantive`，**没有任何降级标记**。
    #     根因：guard 只判 `if not txt`（空），而 `_parse_json` 会把
    #     写了一半的 JSON 抢救回来 ⇒ **截断被当成成功**。
    #     同一轮已给 guard 补上截断检测（`_is_truncated`），
    #     但基础预算该给够还是得给够 —— 靠翻倍重试是兜底，不是常态路径。
    max_output_tokens: 16384
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 16384 }

  # 降级说明。只在探针判定稀薄时触发，写一句话，纯措辞工作。
  probe_degraded:
    # `disabled` 是**平台中性的语义值**，不是字面量：这个环节要「关思考」，
    # 至于怎么关由平台档案声明（internai 发 none、xj189 干脆不发该字段）。
    # 写死 none 的话，切到 xj189 会**反向打开思考** —— 那是个静默多烧 token 的陷阱。
    #
    # ⚠️ **刻意不用 `off` 当这个值**：YAML 1.1 把裸 `off` 解析成布尔 false，
    # 于是 `== "off"` 判不成立、翻译不发生、字段不发 ⇒ 思考反而默认打开。
    # 那个坑真踩过一次（tests/test_platform_switch.py 抓出来的）。
    # 这个环节是纯机械任务，开思考只会白吃预算。
    reasoning_effort: disabled
    # 输出极轻（relevance 实测均 36 token），8192 是浪费；
    # 而且 guard 上限也是 8192 会让「空返回翻倍」无处可翻。
    # 4096 留出翻倍空间，且这两档都是**关思考**的，不碰窄窗口。
    max_output_tokens: 4096
    temperature: 0.0
    guard: { max_reasoning_ratio: 0.5, retry_on_empty: 1, max_output_tokens: 8192 }

  # ---- 框架 ----

  # 研究框架生成。原先挂在 write 上，用了 0.3 的散文温度，
  # 但框架是结构规划任务，输出是 JSON 而不是文章。
  outline:
    # 2026-10-25 迁到 M3.1-Flash low（v18 基线真实载荷 A/B，n=3）：
    #   M3 high 中位 198.5s、3/3 都要吃 1~2 次 guard 重试
    #   （思考吃光 4096 预算 → 空/截断 → 翻倍重发——v18 那 52s
    #   「静默」就是这种被丢掉的尝试）；
    #   M3.1 low 中位 10.6s（5%）、3/3 一次成功、节数 10~12、
    #   grounded_in 100% 通过、queries zh/en 各 5 条。
    #   **退路：删 provider/reasoning/thinking 三行即回 M3。**
    provider: ark_glm
    reasoning_effort: high
    # 流式：绕开 xj189 前面 nginx 的 60 秒读超时（2026-10-10 实测）
    stream: true
    temperature: 0.0
    # 4096 → 16384（2026-10-25）：M3 时 4096 被思考吃光、每次都靠翻倍
    # 重试爬上去；M3.1 low 实测输出 ~1.7k，16384 ≈ 9 倍富余，
    # 一次给够、不靠翻倍梯子（同 write_audit/assess 的迁法）。
    max_output_tokens: 16384
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 16384 }

  # ---- 证据生产 ----

  # 批量抽取断言 + 判来源性质。报告的每一句事实都来自这里，
  # 量大所以用 T1 而不是 T2：抽取本质是仔细读，不是综合。
  extract:
    # `disabled` 是**平台中性的语义值**，不是字面量：这个环节要「关思考」，
    # 至于怎么关由平台档案声明（internai 发 none、xj189 干脆不发该字段）。
    # 写死 none 的话，切到 xj189 会**反向打开思考** —— 那是个静默多烧 token 的陷阱。
    #
    # ⚠️ **刻意不用 `off` 当这个值**：YAML 1.1 把裸 `off` 解析成布尔 false，
    # 于是 `== "off"` 判不成立、翻译不发生、字段不发 ⇒ 思考反而默认打开。
    # 那个坑真踩过一次（tests/test_platform_switch.py 抓出来的）。
    # 这个环节是纯机械任务，开思考只会白吃预算。
    reasoning_effort: disabled
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.6, retry_on_empty: 2, max_output_tokens: 8192 }

  # 相关性闸门。每个来源判一次，但是二元判断，不需要思考。
  # 上一轮实测挂在 assess 上时触发过「reasoning 102/131 超阈值 60%」的告警，
  # 那个信号就是混用的证据。
  relevance:
    # `disabled` 是**平台中性的语义值**，不是字面量：这个环节要「关思考」，
    # 至于怎么关由平台档案声明（internai 发 none、xj189 干脆不发该字段）。
    # 写死 none 的话，切到 xj189 会**反向打开思考** —— 那是个静默多烧 token 的陷阱。
    #
    # ⚠️ **刻意不用 `off` 当这个值**：YAML 1.1 把裸 `off` 解析成布尔 false，
    # 于是 `== "off"` 判不成立、翻译不发生、字段不发 ⇒ 思考反而默认打开。
    # 那个坑真踩过一次（tests/test_platform_switch.py 抓出来的）。
    # 这个环节是纯机械任务，开思考只会白吃预算。
    reasoning_effort: disabled
    # 输出极轻（relevance 实测均 36 token），8192 是浪费；
    # 而且 guard 上限也是 8192 会让「空返回翻倍」无处可翻。
    # 4096 留出翻倍空间，且这两档都是**关思考**的，不碰窄窗口。
    max_output_tokens: 4096
    temperature: 0.0
    guard: { max_reasoning_ratio: 0.5, retry_on_empty: 1, max_output_tokens: 8192 }

  # 缺口评估。决定还要不要继续搜、框架要不要改，驱动整个循环。
  #
  # ⚠️ 4096 → 8192（2026-10-15）。v5 实测最大输出 5,593 = 旧上限的 **137%**，
  # 同样在靠翻倍硬撑；而 2026-10-15 那一轮它已经**真的空返回过一次**
  # （同一天的全量跑日志：`[assess] 空返回 1 次`），只是没让整篇失败
  # 所以没人注意。**和 write_plan 是同一个病。**
  assess:
    # 2026-10-20 迁到 M3.1-Flash low（钉死档案，不跟 defaults 走）。
    # 依据 /tmp/exp_model_ab/summary.txt（M3 vs M3.1 low，每格 n=3，
    # 同一份 v14 检查点回放）：
    #   assess 输出 3.0~7.0k → 2.3~2.4k token，耗时 24~56s → 18~20s，
    #   gaps/has_enough 结构一致。**退路：出问题把 provider 改回
    #   defaults 的老配置（删 provider/reasoning/thinking 三行即回 M3）。**
    provider: ark_glm
    reasoning_effort: high
    # 流式：绕开 xj189 前面 nginx 的 60 秒读超时（2026-10-10 实测）
    stream: true
    temperature: 0.0
    # 16384 ≈ M3.1 low 实测最大输出（~2.4k）的 6 倍富余；
    # 与 guard 同值只为满足 NEEDS_GUARD 显式配置要求（同 write_audit）。
    max_output_tokens: 16384
    # 兜底天花板，不是常规路径。
    guard: { max_reasoning_ratio: 0.6, retry_on_empty: 1, max_output_tokens: 16384 }

  # ⚠️ 这里原来还有一个 `assign`（证据分派：把断言映射到小节），
  # **2026-10-13 删掉**：它要映射的「断言」已经不存在了。
  # `claim` 表被 `superseded_by` 取代（段级/来源级），而分派现在
  # 由 `assess` 带着框架一起做——每个环节调用前都会拿到
  # 「这一节该看哪几段」。留着这段配置只会让人以为有个分派环节没接。

  # 段落概括。批量 12 段，每段一句话，机械生成。
  summarize:
    # ⚠️ **2026-10-18：从 `disabled` 改成 `low`** —— 原因不是省 token，是**正确性**。
    #
    # 这个环节用 `complete_json_forced`（工具调用强制输出 JSON），
    # 而 2026-10-17 实测：**MiniMax 上「关思考 + 发工具」是真调 5~6/10，
    # 出现过模型声称已调用工具并编造查询结果**；开着思考同一形状是 **10/10**。
    # 护栏 `_check_minimax_thinking_tools` 现在会直接拒绝这个组合，
    # 所以不配 `reasoning_effort` 的话，`summarize` 在 MiniMax 上**根本跑不起来**。
    #
    # 代价（按参考库 189 次调用统计）：`summarize` 一轮只 15 次（占 7.9%），
    # 但输入很大（55,836 token，因为要读段落原文）。`low` 的思考增量
    # 相对 55.8k 输入可以忽略。**换回 xj189 时可以改回 `disabled`**
    # （那条路上关思考+工具没有这个问题）。
    reasoning_effort: disabled
    temperature: 0.0
    batch_size: 12
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.5, retry_on_empty: 2, max_output_tokens: 8192 }

  # ---- 占位环节（技术债，代码尚未调用）----
  # 去重：合并内容相同或高度重复的断言。当前抽取阶段没有去重，
  # 同一事实可能由多个来源重复进入报告。后期补齐。
  dedupe:
    # `disabled` 是**平台中性的语义值**，不是字面量：这个环节要「关思考」，
    # 至于怎么关由平台档案声明（internai 发 none、xj189 干脆不发该字段）。
    # 写死 none 的话，切到 xj189 会**反向打开思考** —— 那是个静默多烧 token 的陷阱。
    #
    # ⚠️ **刻意不用 `off` 当这个值**：YAML 1.1 把裸 `off` 解析成布尔 false，
    # 于是 `== "off"` 判不成立、翻译不发生、字段不发 ⇒ 思考反而默认打开。
    # 那个坑真踩过一次（tests/test_platform_switch.py 抓出来的）。
    # 这个环节是纯机械任务，开思考只会白吃预算。
    reasoning_effort: disabled
    # 输出极轻（relevance 实测均 36 token），8192 是浪费；
    # 而且 guard 上限也是 8192 会让「空返回翻倍」无处可翻。
    # 4096 留出翻倍空间，且这两档都是**关思考**的，不碰窄窗口。
    max_output_tokens: 4096
    temperature: 0.0
    guard: { max_reasoning_ratio: 0.6, retry_on_empty: 1, max_output_tokens: 8192 }

  # ---- 写报告 ----
  # 四个阶段而不是两个：写环节现在有主 agent 与子 agent 两种角色、两次不同
  # 的调用（初稿 / 审查、写作 / 返修）。拆开是为了测试期能按阶段归因成本。
  # 档位只有两档，符合三档策略：主 agent high、子 agent low。

  # ⚠️ **这里原来只有一个 `write_plan`，2026-10-17 拆成两个 stage。**
  #
  # 拆的理由不是洁癖，是两件实事：
  #  ① **需求差一个量级**：规约只看框架 + 术语；分派要看 99 段证据的概括。
  #     共用一个额度时，要么都不够，要么都浪费。
  #  ② **归因**：拆之前 write.py 三处调用点在 DB 里全记成 `write_plan`，
  #     历史数据根本分不清哪次是 spec、哪次是 tasks
  #     （上一轮 e2e 的 `write_plan ok 3` 没法归位就是这个原因）。
  #
  # 预算是**按实测定死的**，不再是「先给一点、撞了再翻倍」。
  # 定标脚本：`tests/probe_plan_tasks_modeB.py`、`tests/probe_plan_spec.py`。

  # 主 agent 规约：thesis + 术语表 + 注意事项 + 小节。
  write_plan_spec:
    # 2026-10-26：改走 submit_spec 强制提交 + 默认瘦身提示词
    # （A/B n=3：38s/3 成功/全节覆盖，/tmp/exp_plan_spec、
    # /tmp/exp_slim_dispatch；RA_SPEC_SLIM=0 退回完整提示词）。
    # 2026-10-20 迁到 M3.1-Flash low（钉死档案，不跟 defaults 走）。
    # 依据 /tmp/exp_model_ab/summary.txt（M3 vs M3.1 low，每格 n=3，
    # 同一份 v14 检查点回放）：spec 无 token/耗时收益
    # （5.3~7.4k / 48~65s ↔ 6.3k / 54~59s），但规约 cautions 更细、
    # 规约文本约长 35%——按用户决定一并迁。
    # **退路：删 provider/reasoning/thinking 三行即回 M3 high 老配置。**
    provider: ark_glm
    reasoning_effort: high
    stream: true
    temperature: 0.0
    # ⚠️ 2026-10-17 实测定死（`tests/probe_plan_spec.py`，真实数据回放 n=3：
    # 109 段 / 3 节 / 提示词 19,185 字符）：
    #   思考 token 2,521 / 3,962 / 4,517（中位 3,962），**全部 finish=stop**
    #   正文 4,867~5,809，总 token 最大 6,733，耗时中位 169.7 秒
    # ⇒ 它**远没有分派那么费思考**，32,768 有 4.8 倍余量。
    #   （分派实测思考到 26,002、耗时 292.8 秒 —— 差一个量级，
    #     这正是「必须拆开」的实证。）
    # 24576 ≈ M3.1 low 实测最大输出（~6.5k）的 3.7 倍富余；
    # 与 guard 同值只为满足 NEEDS_GUARD 显式配置要求（同 write_audit）。
    max_output_tokens: 24576
    # M3.1 low 实测单次最长 ~60s，420 与 write_audit 一致、约 7 倍富余。
    timeout_s: 420
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 24576 }

  # 主 agent 分派：产出任务列表。这是整条链上**唯一持有全局视图**的决策点。
  write_plan_tasks:
    # 2026-10-20 迁到 M3.1-Flash low（钉死档案，不跟 defaults 走）。
    # 依据 /tmp/exp_model_ab/summary.txt（同一份 v14 检查点，每格 n=3）：
    #   输出 16~38k → 6~10k token，耗时 140~424s → 34~62s，
    #   uncovered=[]、n_claim 相当。**退路：删 provider/reasoning/
    #   thinking 三行即回 M3 high（65536/1200s）老配置。**
    provider: ark_glm
    reasoning_effort: high
    stream: true
    temperature: 0.0
    # ⚠️ **4,096 → 16,384 → 65,536，前两次都是错的修法（M3 时代）。**
    #
    # `max_tokens` 是思考和正文的**共享天花板**，思考吃满 ⇒ 正文必然 0
    # （实测 @16,384 时 reasoning_tokens 恰好 16,384、正文 0 字）。
    # 所以「撞了空返回就翻倍预算」是把墙抬高、让它想得更远再撞一次。
    # 实测（每格 n=3，同一份 write_plan_tasks 真实载荷）：
    #   high @ 16,384  成功 1/3  思考每次恰好顶满 16,384   finish=length
    #   high @ 65,536  成功 3/3  思考 2,153~26,002         **全部 finish=stop**
    #   low  @ 16,384  成功 3/3  思考 3,044~6,886          全部 finish=stop
    # ⇒ **思考有自然天花板（约 26k token）**：16,384 之下每次被切断，
    #   65,536 之下模型自己想完了、从没撞墙。**「一次给够」是能做到的。**
    #
    # ⚠️ **退路（写在这儿，别丢）**：若 900 秒仍扛不住，降成
    #   `reasoning_effort: low` + `max_output_tokens: 16384`
    #   （实测 3/3、耗时中位 65.6s、思考最大 6,886）。
    #   代价是**推理深度下降，质量未验证**，不是等价替换。
    # 32768 ≈ M3.1 low 实测最大输出（~10k）的 3 倍富余；
    # 与 guard 同值只为满足 NEEDS_GUARD 显式配置要求（同 write_audit）。
    max_output_tokens: 32768
    # M3.1 low 实测单次最长 ~62s，420 与 write_audit 一致、约 7 倍富余。
    timeout_s: 420
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 32768 }

  # 判定依据见 DESIGN_R6_REVIEW.md 2.2 与 DECISIONS.md。
  write_audit:
    # 2026-10-26：默认瘦身提示词（A/B n=3：墙钟中位 92.6→44.6s、
    # 已知矛盾 3/3 抓到，/tmp/exp_audit_trim；
    # RA_AUDIT_TRIM=0 回原提示词）。
    # 2026-10-19 迁到 M3.1-Flash（**钉死在档案上**，不跟 defaults.provider
    # 走——它需要的是这个模型的 effort 旋钮，不是「当前默认平台」）：
    #   · M3 开思考审一次 1.6~2.5 万 token，8192/16384 预算实测全被截断；
    #   · M3.1-Flash 的 effort 是真旋钮：low 实测单次 7~12k / 60~215s；
    #   · effort=high 在 M3.1 上更糟（24.6k 仍截断）——**只能 low**；
    #   · 工具入参 2/16 偏离 schema，由 write.py `_normalize_audit_input`
    #     归一化 + 重试兜住（坑 77）。
    provider: ark_glm
    # M3.1 关不掉思考（disabled→400）：reasoning_effort 在这只当
    # truthy 开关发 adaptive，深度由 thinking_effort=low 控制。
    # validate() 会拦死 reasoning_effort 缺省 / forced_thinking。
    reasoning_effort: high
    temperature: 0.0
    # 24576 ≈ 实测最大输出（~12k）的 2 倍富余。这条路径不走 guard
    # 梯度提预算；guard 上限写同值只为满足 NEEDS_GUARD 的显式配置要求。
    max_output_tokens: 24576
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 24576 }
    # 流式照旧：绕网关读超时（M3.1-Flash low 实测最长 215s，
    # timeout 给到 420s ≈ 2 倍富余）。**只为规避超时，不是为了提速**。
    stream: true
    timeout_s: 420

  # 子 agent 写一个任务。N 次调用，system prompt 与规约前缀固定以命中缓存。
  #
  # ⚠️ 4096 → 8192（2026-10-15）。v5 实测最大输出 5,035 = 旧上限的 **123%**。
  # 它是调用最多的环节（一场 21–30 次），每次靠翻倍硬撑等于把
  # 失败成本乘以一遍。**抬上限不花钱**（只按实际用量计费），
  # 一次空返回浪费的是一整轮思考。
  write_section:
    provider: ark_glm
    # ⚠️ 迁 Ark（2026-11-03）：暂放 ark_mini——速度/并发优先，
    #    质量待 A/B；若换 glm 必须补 reasoning_effort: low（关不掉思考）。
    # 流式：工具循环每轮带上一轮结果、输入更大，实测最长 48.9s
    # 已贴 60 秒墙（工具那一轮直接 504 且**静默降级**，不报错）
    stream: true
    reasoning_effort: low
    # 强制交卷轮只负责把**已经想好**的正文填进 submit_section 参数，
    # 不需要再思考。实测（2026-10-19，n=5，t7/t5r 两个任务）：
    # 开思考干净 1/5 & 3/5（思考吃光 max_tokens 导致正文截断），
    # 关思考 4/5 & 4/5，输出 token 14.3k→9.1k。
    # 风险：MiniMax 关思考+点名工具偶发编造调用——真实验收实测
    # ~1/8～2/8——由 run_tool_loop 检测到没交上后**再关思考**重试
    # 一次（开思考重试会吃光预算，已弃用）。重试仍可能失败：
    # 失败走 fallback 并被判失败进降级，不会带脏文本入稿。
    # 非强制轮（读证据/决定交卷）实测会把思考烧到上限一字未写，
    # 然后在强制轮里「觉得没读完」去调读工具而不交卷。
    # P2 实测（tests/exp_submit_prod.py，n=8，v13 真实任务）：
    #   P0 现状        → t7 7/8，10.2k token / 123s
    #   P1 仅压本上限  → t7 6/8，4.0k / 51s
    #   P2 本上限+钉交卷 → t7 8/8，5.1k / 58s；t5r 8/8；长度中位数不降
    # 取舍：被截断的长读证据轮直接进强制交卷轮，等于少读一点证据
    # （用精度换成本，属预期）。强制交卷轮不受此上限。
    temperature: 0.2
    # 8192 → 16384（2026-10-27）：v21 实测预加载模式下一次写完整节，
    # t14 的 submit_section 入参在 8192 顶断（finish_reason=tool_use
    # 截断），forced_retry 白烧 55s 且在 dispatch 关键路径上。
    # timeout 不随动：16384 tok ÷ 最慢吞吐 62 tok/s ≈ 264s，
    # 仍低于继承的 defaults timeout_s: 300，余量够。
    max_output_tokens: 16384
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 16384 }

  # 子 agent 定点返修。同角色，温度略低以免它把没问题的部分也重写。
  write_revise:
    provider: ark_glm
    # ⚠️ 迁 Ark（2026-11-03）：暂放 ark_mini——速度/并发优先，
    #    质量待 A/B；若换 glm 必须补 reasoning_effort: low（关不掉思考）。
    # 流式：工具循环每轮带上一轮结果、输入更大，实测最长 48.9s
    # 已贴 60 秒墙（工具那一轮直接 504 且**静默降级**，不报错）
    stream: true
    reasoning_effort: low
    # 同 write_section：强制交卷轮关思考更干净、更省。
    # 单独再注一遍是因为 v13 的丢稿事故就出在**返修**——
    # 返修输出只有英文推理却覆盖了旧稿（merge 保护就是为它加的）。
    # 同 write_section：非强制轮压上限防思考烧光（P2，t5r 8/8）。
    # 返修输入更短，浪费轮更狠——烧 4096 上限纯亏。
    temperature: 0.1
    # 4096 → 8192（2026-10-25）：v20 实测整节重写的 submit_section
    # 入参两次被 4096 顶断（EmptyOutput「工具参数拼不成合法 JSON」，
    # stdout 有 max_tokens 截断警告）。与 write_section 同档——
    # 抬上限不花钱，一次截断浪费一整轮。
    max_output_tokens: 8192
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 8192 }

  # 定点补丁返修（2026-10-19，坑 80）：审查给出 quote+action 后，
  # 每个任务一次 `submit_patches` 强制调用产 old→new 替换，
  # 程序做精确匹配与校验；校验不过/定位失败回退 write_revise 整节重写。
  #
  # 为什么关思考：这是**纯编辑任务**——改哪里（quote）、怎么改（fix）
  # 都由审查给定，补丁模型只是照单执行，开思考只会把它推去顺手润色
  # 没被点名的文字。形状抄 tests/exp_audit_nothink.py 的 V1
  # （关思考 + 强制工具，真实验证 5/5）。
  # ⚠️ 风险与 write_section 相同：MiniMax 关思考 + 点名工具偶发编造
  # 调用（~1/8），由「重试一次 + 校验不过回退整节重写」兜底。
  # `reasoning_effort: low` 是给「发工具必须开思考」的配置护栏看的，
  # 强制轮真正关思考靠 forced_thinking（与 write_section 同一机制）。
  # ⚠️ 不许迁 M3.1：forced_thinking: disabled 在 M3.1 上被 validate()
  # 拦死（它关不掉思考），这是有意的——M3.1 没有「关思考」可给。
  write_patch:
    provider: ark_glm
    # ⚠️ 迁 Ark（2026-11-03）：暂放 ark_mini——速度/并发优先，
    #    质量待 A/B；若换 glm 必须补 reasoning_effort: low（关不掉思考）。
    stream: true
    reasoning_effort: low
    temperature: 0.1
    max_output_tokens: 8192
    guard: { retry_on_empty: 1, max_output_tokens: 8192 }
    timeout_s: 180

  # ---- 会话摘要（报告写完后，产品化阶段 3）----
  #
  # 给资产列表用的：让用户在列表里就知道这场研究讲了什么，
  # 不用点开 2 万字的报告。
  #
  # ⚠️ **这里绝对不能写 reasoning_effort**（2026-10-09 实测，xj189 上
  # 省略 = 关思考，传任何值包括 `none` = 开思考）。这是**纯改写任务**，
  # 开思考只会白吃预算——正是 OPTIMIZATION_LOG 里记的
  # 「thinking 吃光输出预算」失效模式。
  #
  # 输出 512 就够（40 字结论 + 3~5 个要点 + 缺口），但给 4096：
  # 一是 guard 的 `max_output_tokens` 是「空返回时翻倍的**目标**」，
  # 给小了无处可翻；二是与其它关思考的轻量档（relevance / summarize）保持一致。
  fast_answer:
    provider: ark_glm
    # 快速档一次性简报（2026-10-27，C1）：纯文本流式，不带工具。
    # ⚠️ 2026-10-27 修：初版照 write_section 抄 `low`+`forced_thinking`，
    # 但 forced_thinking 只管强制工具轮；纯文本流式在 M3 上
    # `reasoning_effort: low` = 开自适应思考——冒烟里思考 43k~61k 字符
    # 吃光 16384 预算、stop_reason=max_tokens、重试一次才算完
    # （152s 作废 + 121s 成功）。M3 的真开关是 thinking.type：
    # `disabled` 走 profile effort_off 翻译后发出
    # `thinking.type=disabled`（provider.py ~2349 实测表）。
    stream: true
    reasoning_effort: low
    temperature: 0.2
    # 基础预算降到 12288：关思考后 V2 实测 out 中位 3022、最大 3324
    # （exp_fast_answer n=3），12288 ≈ 3.7× 余量；guard 上限仍 16384，
    # 让 budget_ladder 有一级可爬（write_section 是平级，这里刻意差一档）。
    max_output_tokens: 12288
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 16384 }
  session_summary:
    # `disabled` 是**平台中性的语义值**，不是字面量：这个环节要「关思考」，
    # 至于怎么关由平台档案声明（internai 发 none、xj189 干脆不发该字段）。
    # 写死 none 的话，切到 xj189 会**反向打开思考** —— 那是个静默多烧 token 的陷阱。
    #
    # ⚠️ **刻意不用 `off` 当这个值**：YAML 1.1 把裸 `off` 解析成布尔 false，
    # 于是 `== "off"` 判不成立、翻译不发生、字段不发 ⇒ 思考反而默认打开。
    # 那个坑真踩过一次（tests/test_platform_switch.py 抓出来的）。
    # 这个环节是纯机械任务，开思考只会白吃预算。
    reasoning_effort: disabled
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.5, retry_on_empty: 1, max_output_tokens: 8192 }


# 候选池与历史结论
alternatives:
  - id: MiniMax-M3
    status: adopted
    role: "T0 档：不需要思考的环节（降级说明、相关性闸门、段落概括）"
    note: "省略 thinking 字段即关闭思考（官方文档表格）。实测零思考、正文稳定"

  - id: MiniMax-M3.1-Flash-Preview
    status: adopted
    role: "T1 / T2 档：需要判断力的全部环节"
    note: |
      预检实测（tests/preflight_models.py，8 个环节用真实提示词跑）：
      T1 low 档思考 337 到 828 字符、正文稳定；T2 high 档思考 6,743 字符。
      8/8 环节的 JSON 均可解析（走 _parse_json 兜底），字段齐全。
      Anthropic 端点没有 response_format，严格 JSON 靠提示词约束。
      2026-10-19/20：现役形态是 `MiniMax-M3.1-Flash`（minimax31 档案）
      + effort low——write_audit、assess、write_plan_spec、
      write_plan_tasks 四个环节钉死在它上面（思考关不掉，只能 low）。

  - id: MiniMax-M2.7-highspeed
    status: rejected
    reason: "名为高速实则最慢：简单请求 15-21 秒，思考 2488-3740 字符。抽取环节不可用"

  - id: space-bunny-free
    status: retired
    reason: |
      2026-10-04 起退出活跃配置。此前承担抽取、去重、缺口评估、概括四类共 21 次调用，
      占单场研究 80% 的 token，但它是免费模型、没有服务保证，且 MiniMax 三档在
      预检里全部通过，没有继续保留的理由。
      ⬜ 技术债：作为故障降级通道的方案待定，需要第二组模型。

  - id: muse-spark-1.3-contributor-free
    status: blocked
    reason: "OpenCode 免费层仅允许客户端内部调用，直连返回 403 FreeTierError"

  - id: longcat-2.5-preview-free
    status: blocked
    reason: "同上"

  - id: ling-3.1-flash-free
    status: blocked
    reason: "同上"
