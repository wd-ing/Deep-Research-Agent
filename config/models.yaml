# 各环节的模型配置
# 换模型只改这里，不动代码。
#
# ── 模型策略（2026-10-04 定）────────────────────────────────────────
# 全部走 MiniMax，分三档对应三种任务难度：
#
#   T0  MiniMax-M3               不发 thinking、不发 effort → 官方文档：省略即关闭思考
#   T1  M3.1-Flash-Preview        output_config.effort: low
#   T2  M3.1-Flash-Preview        output_config.effort: high
#
# ⚠️ 不要再用 thinking.budget_tokens
# 那是 Anthropic 扩展思考的字段，MiniMax 不认。它的 thinking.type 合法值只有
# adaptive 与 disabled，没有 enabled。那个字段不报 400、只是被静默忽略，于是
# 「0 / 1024 / 4096 / 不传」四组设置实际是同一组（都等于省略 → adaptive +
# 默认 effort=max），思考长度清一色 ~35,000 字符。曾据此得出「思考无法控制、
# 只能换模型」——那是测错了参数名。真正的旋钮是 output_config.effort。
#
# T2 档之所以给足预算：effort 会连带把思考拉长（实测 high 档思考 6,743 字符、
# low 档 575 字符），思考与正文共用 max_tokens，预算不够正文就是 0 字符。
#
# ── 环节切分（2026-10-04）──────────────────────────────────────────
# 原来四个阶段各自承担了性质不同的任务，其中三处耦合不合理，已拆开：
#   · 框架生成曾挂在 write 上（温度 0.3 的散文配置去做结构规划）
#   · 相关性闸门与缺口评估共用 assess，前者是二元判断却挂着思考档位
#   · 证据分派与缺口评估共用 assess
#   · 探针的「快速定性」与「读两万字做综合」共用一档
#
# ── 三道防线（沿用，含义已变）──────────────────────────────────────
# 空返回是真实存在的失败模式，所以每个环节都要配 guard：
#   1. 给足输出预算
#   2. 监控思考占比，超阈值告警
#   3. 空输出自动重试并翻倍预算

# ── 可用的 provider 档案（2026-10-09）──────────────────────────────
#
# **模型不写死在代码里。** 每个阶段在 `stages:` 下声明自己用哪个 `provider:`，
# 下面这些档案给出对应的模型名 / 地址 / 密钥变量 / 思考档位。
# 换平台只改这一行，代码一行都不动。
#
#   minimax  —— Anthropic Messages 协议，走 `output_config.effort` 控制思考
#   opencode —— OpenAI 兼容，走 `reasoning_effort`
#   xj189    —— OpenAI 兼容，DeepSeek 系（deepseek-v4-flash-0731，100 万上下文）
#
# xj189 接入预检已实测（2026-10-09，`tests/preflight_xj189.py`）：
#   · 严格 JSON      ✓ 带不带 response_format 都能解析
#   · 工具调用        ✓ OpenAI 标准格式，**支持一个回合多个 tool_calls**，
#                       arguments 是 JSON 字符串 —— write 子 agent 的工具循环能直接用
#   · reasoning_effort 七个档位全部 200，但**思考长度不随档位变**，旋钮疑似无效
#   · 缓存            ✓ 支持，字段是**顶层 `cached_tokens`**
#                       （740 token 前缀不命中、3,489 命中 3,328，门槛在两者之间）
#
# xj189 的平台限流有三种，处置完全不同（`classify_limit`）：
#   · 「服务组/模型调用频率已达上限」 → 按 Retry-After 退避，可重试
#   · 「当前账户并发已达上限」         → 等在途调用腾位，退避要更长
#   · MODEL_SEAT_QUOTA_EXHAUSTED      → **重试无效**，得管理员调额度
# 所以限流额度与传输断连额度**分开计**，否则一次限流就把重试机会耗光。

providers:
  minimax:
    provider: minimax
    base_url: https://api.minimaxi.com/anthropic
    api_key_env: MINIMAX_API_KEY
  opencode:
    provider: opencode
    base_url: https://api.opencode.ai/v1
    api_key_env: OPENCODE_API_KEY
  xj189:
    provider: xj189
    model: deepseek-v4-flash-0731
    base_url: https://ai.xj.189.cn/api/v1
    api_key_env: XJ189_API_KEY
    # ⚠️ **这里不要写 reasoning_effort。**（2026-10-09 实测，3/3 复验）
    #
    # 该平台**省略该字段 = 关思考**，传**任何**值（含 none）= 开思考——
    # 和平台文档写的「默认 max、none 是一个档位」正好相反。
    #   不传        reasoning_content = [0, 0, 0]     1.5~3.0s
    #   none        [140, 121, 399]                   2.3~3.6s
    #   low         [432, 213, 374]                   2.6~7.1s
    #   high        [485, 456, 382]                   3.8~10.5s
    #
    # 所以**档案层留空 = 默认关思考**，需要推理的阶段自己在 stages 下写
    # `reasoning_effort: high/low`。这样「高并发内容轻关思考、其余开思考」
    # 就落在配置里，代码一行都不用动。
    #
    # ⚠️ **thinking 吃光输出预算**（与 MiniMax 同一失效模式）：
    #   max_tokens=2048 → 正文 0 字符，reasoning 5,574
    #   max_tokens=8192 → 正常（实测生成 10 节规约只花 1,852 token）
    #   max_tokens=16384 → **504 网关超时**
    # 所以 max_output_tokens 是个窄窗口：给小了没正文、给大了网关挂。
    max_output_tokens: 8192
    # 网关对长生成会 504，超时必须给足
    timeout_s: 300

defaults:
  temperature: 0.0
  # 180 秒不够。实测（2026-10-05，R6 三轮真实数据）：
  #   write_audit 平均 132 秒、最长 170 秒 —— 已经贴着天花板
  #   write_plan  平均 100 秒
  # 贴天花板意味着：需要 185 秒的调用被砍在 180 秒，然后**整次重发**。
  # 表面上「重试吸收抖动」，实际是把超时变成重发，白花一遍钱和时间。
  # 断连全部集中在这两个 effort:high 的阶段，write_section/write_revise
  # （effort:low，均 17–26 秒）几乎不超时——这正说明它是超时不是抖动。
  timeout_s: 300

# ── 思考分档（2026-10-09，全切 xj189 之后）─────────────────────────
#
# xj189 的旋钮是 `reasoning_effort`，而实测**省略该字段 = 关思考**、
# 传任何值（含 none）= 开。所以「哪个阶段开思考」完全由 stages 下的
# 有无这一行决定，**档案层留空即可**。
#
# 分档依据是 C1d2 那轮的真实数据（调用次数 / 均输出 / 总耗时）：
#
#   档 0  关思考   relevance(92次,均36token) summarize(18次,均263)
#                  extract(6) probe_light(1) probe_degraded(1)
#                  理由：这四档占全部调用的 68%、耗时的 24%，
#                  而输出只有 36~535 token——给它们开思考是纯浪费。
#
#   档 1  low      outline(1) assess(2) write_section(30) write_revise(5)
#                  write_section 用 low 而不是 high：它调用最多（30 次），
#                  边际成本最高，而正文质量未必更好。**这是待验证的保守取值。**
#
#   档 2  high     probe_outline(1) write_plan(2) write_audit(2)
#                  理由：规划与审查是核心推理，量大但调用少。
#
# ⚠️ **质量全部未验证**。这批档位是按「调用次数 × 输出长度」推的，
#    不是按质量实测。切过去的第一件事是跑一轮对比，看每档该给的
#    思考强度给对了没有。

stages:
  # ---- 探针 ----
  probe_light:
    provider: xj189
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.6, retry_on_empty: 2, max_output_tokens: 8192 }

  # 读 2-3 篇正文归纳领域轮廓。整场研究的地基——大纲的 grounded_in
  # 全部指回这里，所以给最高档。
  probe_outline:
    provider: xj189
    # 流式：绕开 xj189 前面 nginx 的 60 秒读超时（2026-10-10 实测）
    stream: true
    reasoning_effort: high
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 8192 }

  # 降级说明。只在探针判定稀薄时触发，写一句话，纯措辞工作。
  probe_degraded:
    provider: xj189
    # 输出极轻（relevance 实测均 36 token），8192 是浪费；
    # 而且 guard 上限也是 8192 会让「空返回翻倍」无处可翻。
    # 4096 留出翻倍空间，且这两档都是**关思考**的，不碰窄窗口。
    max_output_tokens: 4096
    temperature: 0.0
    guard: { max_reasoning_ratio: 0.5, retry_on_empty: 1, max_output_tokens: 8192 }

  # ---- 框架 ----

  # 研究框架生成。原先挂在 write 上，用了 0.3 的散文温度，
  # 但框架是结构规划任务，输出是 JSON 而不是文章。
  outline:
    provider: xj189
    # 流式：绕开 xj189 前面 nginx 的 60 秒读超时（2026-10-10 实测）
    stream: true
    reasoning_effort: high
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 8192 }

  # ---- 证据生产 ----

  # 批量抽取断言 + 判来源性质。报告的每一句事实都来自这里，
  # 量大所以用 T1 而不是 T2：抽取本质是仔细读，不是综合。
  extract:
    provider: xj189
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.6, retry_on_empty: 2, max_output_tokens: 8192 }

  # 相关性闸门。每个来源判一次，但是二元判断，不需要思考。
  # 上一轮实测挂在 assess 上时触发过「reasoning 102/131 超阈值 60%」的告警，
  # 那个信号就是混用的证据。
  relevance:
    provider: xj189
    # 输出极轻（relevance 实测均 36 token），8192 是浪费；
    # 而且 guard 上限也是 8192 会让「空返回翻倍」无处可翻。
    # 4096 留出翻倍空间，且这两档都是**关思考**的，不碰窄窗口。
    max_output_tokens: 4096
    temperature: 0.0
    guard: { max_reasoning_ratio: 0.5, retry_on_empty: 1, max_output_tokens: 8192 }

  # 缺口评估。决定还要不要继续搜、框架要不要改，驱动整个循环。
  assess:
    provider: xj189
    # 流式：绕开 xj189 前面 nginx 的 60 秒读超时（2026-10-10 实测）
    stream: true
    reasoning_effort: low
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.6, retry_on_empty: 1, max_output_tokens: 8192 }

  # 证据分派。把断言映射到小节，直接决定报告结构，不能用 T0。
  assign:
    provider: xj189
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.6, retry_on_empty: 1, max_output_tokens: 8192 }

  # 段落概括。批量 12 段，每段一句话，机械生成。
  summarize:
    provider: xj189
    temperature: 0.0
    batch_size: 12
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.5, retry_on_empty: 2, max_output_tokens: 8192 }

  # ---- 占位环节（技术债，代码尚未调用）----
  # 去重：合并内容相同或高度重复的断言。当前抽取阶段没有去重，
  # 同一事实可能由多个来源重复进入报告。后期补齐。
  dedupe:
    provider: xj189
    # 输出极轻（relevance 实测均 36 token），8192 是浪费；
    # 而且 guard 上限也是 8192 会让「空返回翻倍」无处可翻。
    # 4096 留出翻倍空间，且这两档都是**关思考**的，不碰窄窗口。
    max_output_tokens: 4096
    temperature: 0.0
    guard: { max_reasoning_ratio: 0.6, retry_on_empty: 1, max_output_tokens: 8192 }

  # ---- 写报告 ----
  # 四个阶段而不是两个：写环节现在有主 agent 与子 agent 两种角色、两次不同
  # 的调用（初稿 / 审查、写作 / 返修）。拆开是为了测试期能按阶段归因成本。
  # 档位只有两档，符合三档策略：主 agent high、子 agent low。

  # 主 agent 规划：产出写作规约 + 任务列表。看的是断言摘要不是全文。
  write_plan:
    # 流式：为绕开 xj189 前面 nginx 的 60 秒读超时（2026-10-10 实测
    # 37.7s 擦线过，离 60 秒只差 22 秒；同参数流式跑过 245.5s）。**只为规避超时，不是为了提速**。
    stream: true
    provider: xj189
    reasoning_effort: high
    temperature: 0.0
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 8192 }

  # 独立审阅人：读全稿（12 节约 3 万字），判断是否返修、返修是否有效。
  #
  # **档位已定：保持 T2(high)，不降。**（用户 2026-10-06 拍板）
  # 决策依据：跨任务矛盾（"t3 的卤化物数据和 t2 的结论打架"）要同时持有
  # 全文所有小节 + 规约才能发现，而机械项（段号格式、越界引用）程序已 100% 拦下。
  # 解耦审查身份之后它明显更严（high 数 3 → 11），这个收益不能拿降档去换。
  # 成本侧的解法是 timeout（180→300）和减输入，不是降档。
  #
  # 实测：6 次调用 / 286k 输入 token / 均 132 秒 / 思考链 29k–33k 字符，
  # 两次触发思考占比护栏。它是全套里最重的一环，也是断连唯一集中的地方。
  # 判定依据见 DESIGN_R6_REVIEW.md 2.2 与 DECISIONS.md。
  write_audit:
    # 流式：为绕开 xj189 前面 nginx 的 60 秒读超时（2026-10-10 实测
    # 已连撞三次 504、环节判定不可用；同参数流式跑过 245.5s）。**只为规避超时，不是为了提速**。
    stream: true
    provider: xj189
    reasoning_effort: high
    temperature: 0.0
    max_output_tokens: 8192
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 16384 }

  # 子 agent 写一个任务。N 次调用，system prompt 与规约前缀固定以命中缓存。
  write_section:
    provider: xj189
    # 流式：工具循环每轮带上一轮结果、输入更大，实测最长 48.9s
    # 已贴 60 秒墙（工具那一轮直接 504 且**静默降级**，不报错）
    stream: true
    reasoning_effort: low
    temperature: 0.2
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 8192 }

  # 子 agent 定点返修。同角色，温度略低以免它把没问题的部分也重写。
  write_revise:
    provider: xj189
    # 流式：工具循环每轮带上一轮结果、输入更大，实测最长 48.9s
    # 已贴 60 秒墙（工具那一轮直接 504 且**静默降级**，不报错）
    stream: true
    reasoning_effort: low
    temperature: 0.1
    max_output_tokens: 4096
    guard: { max_reasoning_ratio: 0.7, retry_on_empty: 2, max_output_tokens: 8192 }

# 候选池与历史结论
alternatives:
  - id: MiniMax-M3
    status: adopted
    role: "T0 档：不需要思考的环节（降级说明、相关性闸门、段落概括）"
    note: "省略 thinking 字段即关闭思考（官方文档表格）。实测零思考、正文稳定"

  - id: MiniMax-M3.1-Flash-Preview
    status: adopted
    role: "T1 / T2 档：需要判断力的全部环节"
    note: |
      预检实测（tests/preflight_models.py，8 个环节用真实提示词跑）：
      T1 low 档思考 337 到 828 字符、正文稳定；T2 high 档思考 6,743 字符。
      8/8 环节的 JSON 均可解析（走 _parse_json 兜底），字段齐全。
      Anthropic 端点没有 response_format，严格 JSON 靠提示词约束。

  - id: MiniMax-M2.7-highspeed
    status: rejected
    reason: "名为高速实则最慢：简单请求 15-21 秒，思考 2488-3740 字符。抽取环节不可用"

  - id: space-bunny-free
    status: retired
    reason: |
      2026-10-04 起退出活跃配置。此前承担抽取、去重、缺口评估、概括四类共 21 次调用，
      占单场研究 80% 的 token，但它是免费模型、没有服务保证，且 MiniMax 三档在
      预检里全部通过，没有继续保留的理由。
      ⬜ 技术债：作为故障降级通道的方案待定，需要第二组模型。

  - id: muse-spark-1.3-contributor-free
    status: blocked
    reason: "OpenCode 免费层仅允许客户端内部调用，直连返回 403 FreeTierError"

  - id: longcat-2.5-preview-free
    status: blocked
    reason: "同上"

  - id: ling-3.1-flash-free
    status: blocked
    reason: "同上"
