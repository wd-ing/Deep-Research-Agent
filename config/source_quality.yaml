# 抓到后直接丢弃的域名(后缀匹配,含子域)——只放「永远不是研究材料」的类别。
drop_domains:
  # 招聘平台
  - liepin.com
  - zhaopin.com
  - 51job.com
  - lagou.com
  - zhipin.com
  - jobxzc.com
# 标题或正文开头出现这些模式 → 判定为未渲染模板/坏页,丢弃。
drop_title_regex:
  - '\{\{[^}]*\}\}'      # {{custom_sec.title}} 这类 mustache 模板
  - '\$\{[^}]*\}'        # ${var}
  - '<%[^%]*%>'          # <% %>
drop_text_head_regex:    # 只看正文前 300 字
  - '\{\{[^}]*\}\}'

# 线索级来源：不丢弃（内容可能相关），但来源清单里标「线索级」，
# 写手/审查对其中的具体数字降级处理（抽样见 CONTEXT 坑 95）。
clue_grade_domains:
  - renrendoc.com    # 人人文库
  - docin.com        # 豆丁
  - doc88.com        # 道客巴巴
  - book118.com      # 原创力文档
  - wenku.baidu.com  # 百度文库
  - taodocs.com      # 淘豆网
