      if(s1>s0+2){const pts=[];for(let s=s0;s<s1;s+=6)pts.push(atS(s));pts.push(atS(s1));stroke(pts,markA,2.4);}
    }
    // comet tail (cut where the path turns sharply >50°, so no folded V residue)
    const spd=ms-msSmooth(Math.max(0,t-0.12));
    const tail=clamp(spd*3,0,TAIL);
    if(tail>4){
      const all=[];for(let s=Math.max(0,ms-tail);s<ms;s+=7)all.push(atS(s));all.push(atS(ms));
      // truncate the tail where cumulative bend exceeds ~40° or any single turn >55°
      let cut=0,bend=0;
      for(let i=all.length-1;i>1;i--){
        const a=all[i],b=all[i-1],c=all[i-2],l1=Math.hypot(a.x-b.x,a.y-b.y),l2=Math.hypot(b.x-c.x,b.y-c.y);

          const cos=((a.x-b.x)*(b.x-c.x)+(a.y-b.y)*(b.y-c.y))/(l1*l2);

  }

    const k=ease.expoOut(seg(t,te.t,te.t+0.35));if(k<=0)continue;
    const gw=1-ease.smooth(seg(t,GHOST0-0.1,GHOST0+0.5,t));if(gw<=0.02)continue;
    const mx=(te.p0.x+te.p1.x)/2-30,my=(te.p0.y+te.p1.y)/2;
    const al=(te.faint?0.16:0.42)*gw;
    TC.strokeStyle=`rgba(62,143,79,${al})`;TC.lineWidth=te.faint?0.8:1.1;
    const a=proj(M,te.p0.x,te.p0.y),b=proj(M,te.p1.x,te.p1.y),m=proj(M,mx,my);
    TC.beginPath();TC.moveTo(a[0],a[1]);TC.quadraticCurveTo(m[0],m[1],a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k);TC.stroke();
  }
  const sk=ease.expoOut(seg(t,STRIKE0,STRIKE0+0.28));
  if(sk>0){const y=STRIKE_Y,x0=PAGE.tx+56,x1=x0+Math.min(660,(secEls[0].lines[2]._w||660))*sk;
    TC.strokeStyle='rgba(196,65,47,0.8)';TC.lineWidth=2;
    const a=proj(M,x0,y),b=proj(M,x1,y);TC.beginPath();TC.moveTo(a[0],a[1]);TC.lineTo(b[0],b[1]);TC.stroke();}
}
function seek(t){

  {const anyPass=JUDGE_TS.find(x=>t>=x&&t<x+0.25); const rj=(t>=RJ1&&t<RJ1+0.4)||(t>=RJ2&&t<RJ2+0.4);

        l.chip.style.color=flare>0.4?'var(--seal)':'';

        l.del.style.left=(l._w*0.40)+'px';

window.__seek=t=>{if(!PATH)return false;seek(t);return true;};
window.__motion=(t0,t1)=>{
  if(!PATH)return 0;
  let d=OM.screenTravel(camAt(t0),camAt(t1),camAt((t0+t1)/2),{W,H});
  for(let k=0;k<=4;k++){const a=t0+(t1-t0)*k/5,b=t0+(t1-t0)*(k+1)/5;
    const M0=Mview(a),M1=Mview(b);
    const s0=msSmooth(a),s1=msSmooth(b);
    if(s0>=0&&s1>=0){const p0=atS(s0),p1=atS(s1);const q0=proj(M0,p0.x,p0.y),q1=proj(M1,p1.x,p1.y);d=Math.max(d,Math.hypot(q0[0]-q1[0],q0[1]-q1[1]));}

    {const oa=ease.expoIn(seg(a,16.15,17.3))*1400,ob=ease.expoIn(seg(b,16.15,17.3))*1400;if(ob-oa>0.5){const qa=proj(M0,OUTL.x-390-oa,OUTL.y),qb=proj(M1,OUTL.x-390-ob,OUTL.y);d=Math.max(d,Math.hypot(qb[0]-qa[0],qb[1]-qa[1]));}}
    for(const te of TETHERS){const ka=ease.expoOut(seg(a,te.t,te.t+0.35)),kb=ease.expoOut(seg(b,te.t,te.t+0.35));if(kb-ka>0.02){const xa=lerp(te.p0.x,te.p1.x,ka),ya=lerp(te.p0.y,te.p1.y,ka),xb=lerp(te.p0.x,te.p1.x,kb),yb=lerp(te.p0.y,te.p1.y,kb);const qa=proj(M0,xa,ya),qb=proj(M1,xb,yb);d=Math.max(d,Math.hypot(qb[0]-qa[0],qb[1]-qa[1]));}}

  }
