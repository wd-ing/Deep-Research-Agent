use_default_settings: true

general:
  instance_name: "WD Search"
  debug: false

server:
  # 容器内端口，对外由 Caddy 反代，宿主机映射 127.0.0.1:8888
  bind_address: "127.0.0.1"
  port: 8080
  # 公网暴露，限流器必须开（本机自用才建议关）
  limiter: true
  public_instance: false
  image_proxy: false
  default_http_headers:
    X-Content-Type-Options: "nosniff"
    Referrer-Policy: "no-referrer"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

ui:
  static_use_hash: true
  infinite_scroll: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true

engines:
  # 中文源
  - name: baidu
    disabled: false
  - name: bing
    disabled: false
